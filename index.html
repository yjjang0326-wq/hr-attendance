<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR 근태·급여 관리 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --sky-900:#0A3D62; --sky-800:#0B5E96; --sky-700:#0B7FC7; --sky-600:#1194DC;
    --sky-500:#38B6F0; --sky-300:#8ED6F7; --sky-100:#DCEEFB; --sky-50:#F1F8FE;
    --ink:#0F2942; --muted:#6B8299; --line:#DBE7F1; --page:#F4F8FC; --white:#fff;
    --ok:#0E9F6E; --ok-bg:#E6F6F0; --warn:#B45309; --warn-bg:#FDF3E3;
    --no:#C2410C; --no-bg:#FDECE6; --gray-bg:#EEF3F7;
    --shadow:0 1px 2px rgba(16,55,89,.06), 0 8px 24px -12px rgba(16,55,89,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:inherit;font-size:14px;color:inherit}
  button{cursor:pointer}
  table{border-collapse:collapse;width:100%}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- 로그인 ---------- */
  .login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
  .login-visual{
    background:linear-gradient(160deg,var(--sky-800) 0%,var(--sky-600) 55%,var(--sky-500) 100%);
    color:#fff;padding:64px 60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .login-visual::after{content:"";position:absolute;right:-140px;bottom:-160px;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.08)}
  .login-visual::before{content:"";position:absolute;right:60px;top:-120px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06)}
  .lv-brand{font-size:13px;letter-spacing:.22em;opacity:.85;font-weight:600}
  .lv-title{font-size:40px;font-weight:800;line-height:1.25;margin:22px 0 14px;letter-spacing:-.02em}
  .lv-sub{font-size:15px;opacity:.9;max-width:420px;line-height:1.7}
  .lv-cos{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;position:relative;z-index:1}
  .lv-cos span{border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600}
  .lv-foot{font-size:12.5px;opacity:.75;position:relative;z-index:1}
  .login-panel{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--white)}
  .login-card{width:100%;max-width:390px}
  .login-card h2{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
  .login-card p.desc{color:var(--muted);margin:0 0 26px;font-size:13.5px}
  .roletabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sky-50);border:1px solid var(--line);padding:5px;border-radius:12px;margin-bottom:22px}
  .roletabs button{border:0;background:transparent;padding:11px 4px;border-radius:8px;font-weight:600;color:var(--muted);transition:.15s}
  .roletabs button.on{background:var(--sky-700);color:#fff;box-shadow:0 2px 8px rgba(11,127,199,.3)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--sky-800);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--white);outline:none}
  .field input:focus,.field select:focus{border-color:var(--sky-500);box-shadow:0 0 0 3px var(--sky-100)}
  .btn-primary{width:100%;padding:13px;border:0;border-radius:9px;background:var(--sky-700);color:#fff;font-weight:700;font-size:15px;margin-top:8px}
  .btn-primary:hover{background:var(--sky-800)}
  .hint{margin-top:20px;background:var(--sky-50);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.75}
  .hint b{color:var(--sky-800)}
  .linkrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}
  .linkrow button{background:none;border:0;padding:4px 2px;font-size:13px;font-weight:600;color:var(--sky-800);text-decoration:underline;text-underline-offset:3px}
  .linkrow button:hover{color:var(--sky-600)}
  .linkrow .sep{width:1px;height:12px;background:var(--line)}
  .backlink{background:none;border:0;padding:0;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px}
  .backlink:hover{color:var(--sky-700)}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps div{flex:1;height:4px;border-radius:3px;background:var(--line)}
  .steps div.on{background:var(--sky-500)}
  .maskbox{background:var(--sky-50);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center;margin-bottom:16px}
  .maskbox .lb{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .maskbox .vl{font-size:21px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .okbox{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:14px;font-weight:600}
  .err{background:var(--no-bg);color:var(--no);border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:14px;font-weight:600}

  /* ---------- 앱 레이아웃 ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:var(--sky-900);color:#cfe6f7;padding:22px 0;display:flex;flex-direction:column}
  .side .logo{padding:0 22px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
  .side .logo b{display:block;color:#fff;font-size:16.5px;letter-spacing:-.01em}
  .side .logo span{font-size:11.5px;letter-spacing:.18em;opacity:.6}
  .navitem{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:14px;color:#b9d6ec;border-left:3px solid transparent;cursor:pointer}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff}
  .navitem.on{background:rgba(56,182,240,.16);border-left-color:var(--sky-500);color:#fff;font-weight:700}
  .navitem .ic{width:18px;text-align:center;opacity:.9}
  .side .spacer{flex:1}
  .side .me{margin:0 14px;background:rgba(255,255,255,.07);border-radius:10px;padding:13px 14px;font-size:12.5px}
  .side .me b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
  .side .me .tag{display:inline-block;margin-top:8px;background:var(--sky-500);color:#04283f;font-weight:700;border-radius:5px;padding:2px 7px;font-size:11px}
  .side .sync{margin:10px 14px 0;font-size:11.5px;color:#9fc6e4;line-height:1.5}
  .side .sync span{color:#dcefff;font-weight:600}
  .side .out{margin:12px 14px 0;text-align:center;background:transparent;border:1px solid rgba(255,255,255,.25);color:#cfe6f7;border-radius:8px;padding:9px}
  .side .out:hover{background:rgba(255,255,255,.1);color:#fff}

  .main{padding:26px 30px 60px;max-width:1360px}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .pagehead h1{font-size:22px;margin:0 0 5px;letter-spacing:-.02em}
  .pagehead p{margin:0;color:var(--muted);font-size:13px}

  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px}
  .card > h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .body{padding:18px}
  .card .body.tight{padding:0}

  /* 탭 */
  .cotabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .cotab{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:700;color:var(--muted)}
  .cotab.on{background:var(--sky-700);border-color:var(--sky-700);color:#fff;box-shadow:0 3px 10px rgba(11,127,199,.25)}
  .cotab small{display:block;font-weight:600;font-size:11px;opacity:.75}
  .montabs{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:7px;margin-bottom:16px}
  .montab{border:0;background:transparent;border-radius:8px;padding:11px 0;font-weight:700;color:var(--muted);font-size:13.5px}
  .montab:hover{background:var(--sky-50);color:var(--sky-800)}
  .montab.on{background:var(--sky-100);color:var(--sky-800);box-shadow:inset 0 0 0 1.5px var(--sky-500)}
  .montab span{display:block;font-size:10.5px;font-weight:600;opacity:.65}

  /* 통계 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .lb{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:8px}
  .stat .vl{font-size:25px;font-weight:800;letter-spacing:-.02em}
  .stat .vl small{font-size:14px;font-weight:700;margin-left:2px;color:var(--muted)}
  .stat.accent{background:linear-gradient(150deg,var(--sky-700),var(--sky-600));border-color:var(--sky-700);color:#fff}
  .stat.accent .lb{color:rgba(255,255,255,.85)}
  .stat.accent .vl small{color:rgba(255,255,255,.8)}

  /* 표 */
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px}
  thead th{background:var(--sky-50);color:var(--sky-800);font-size:12.5px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#FAFDFF}
  tbody tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}
  td.c,th.c{text-align:center}
  tfoot td{background:var(--sky-50);font-weight:800;border-top:2px solid var(--sky-300);border-bottom:0}
  .sun{color:#C2410C}.sat{color:#1D6FB8}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:15px}

  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .p-ok{background:var(--ok-bg);color:var(--ok)}
  .p-wait{background:var(--warn-bg);color:var(--warn)}
  .p-no{background:var(--no-bg);color:var(--no)}
  .p-none{background:var(--gray-bg);color:var(--muted)}
  .p-co{background:var(--sky-100);color:var(--sky-800)}

  .btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--ink)}
  .btn:hover{border-color:var(--sky-500);color:var(--sky-800);background:var(--sky-50)}
  .btn.pri{background:var(--sky-700);border-color:var(--sky-700);color:#fff}
  .btn.pri:hover{background:var(--sky-800);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ok:hover{background:#0B7E58;color:#fff}
  .btn.dg{color:var(--no);border-color:#F3CFC1}
  .btn.dg:hover{background:var(--no-bg);color:var(--no)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tin{border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:112px;background:var(--white)}
  .tin:focus{outline:none;border-color:var(--sky-500);box-shadow:0 0 0 3px var(--sky-100)}
  .tin:disabled{background:var(--gray-bg);color:var(--muted)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .note{background:var(--sky-50);border:1px solid var(--line);border-left:3px solid var(--sky-500);border-radius:8px;padding:12px 15px;font-size:12.5px;color:var(--muted);line-height:1.8}
  .note b{color:var(--sky-800)}

  .bar{height:9px;border-radius:5px;background:var(--sky-100);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky-600),var(--sky-400,#5ac2f2))}

  /* 오늘 근무 카드 */
  .today{display:grid;grid-template-columns:1.2fr 1fr;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}
  .today .left{background:linear-gradient(155deg,var(--sky-800),var(--sky-600));color:#fff;padding:26px 28px}
  .today .date{font-size:13px;opacity:.85;font-weight:600;letter-spacing:.05em}
  .today .clock{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  .today .st{font-size:13.5px;opacity:.9}
  .today .right{background:var(--white);padding:24px 26px;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .bigbtn{padding:15px;border-radius:10px;border:0;font-size:15.5px;font-weight:800;color:#fff;background:var(--sky-700)}
  .bigbtn.out{background:var(--sky-900)}
  .bigbtn:disabled{background:var(--gray-bg);color:var(--muted)}
  .tval{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 12px;background:var(--sky-50);border-radius:8px}
  .tval b{font-size:15px}
  .offbox{background:var(--gray-bg);border:1px dashed #C3D2DE;border-radius:10px;padding:20px 16px;text-align:center;
    color:var(--muted);font-weight:700;font-size:14px}
  .offbox span{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--sky-800)}
  .punch{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--white)}
  .punch .ph{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--sky-800);margin-bottom:9px}
  .punch .done{background:var(--sky-50);border:1px solid var(--sky-100);border-radius:9px;padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--sky-800)}
  .punch .done b{font-size:20px;letter-spacing:-.01em;margin:0 3px}
  .punch .done span{display:block;margin-top:5px;font-size:12px;font-weight:600;color:var(--muted)}


  /* 확인 모달 · 알림 */
  .ovl{position:fixed;inset:0;background:rgba(10,61,98,.45);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px}
  .dlg{background:#fff;border-radius:14px;width:100%;max-width:400px;box-shadow:0 20px 60px -20px rgba(10,61,98,.5);overflow:hidden}
  .dlg .h{padding:20px 22px 0;font-size:16.5px;font-weight:800}
  .dlg .b{padding:10px 22px 20px;color:var(--muted);font-size:13.5px;line-height:1.7}
  .dlg .f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;background:var(--sky-50);border-top:1px solid var(--line)}
  .dlg .f button{padding:9px 18px;border-radius:8px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:#fff}
  .dlg .f button.go{background:var(--sky-700);border-color:var(--sky-700);color:#fff}
  .dlg .f button.dgo{background:var(--no);border-color:var(--no);color:#fff}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:950;
    background:var(--sky-900);color:#fff;padding:13px 22px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px -10px rgba(10,61,98,.6);max-width:80vw;text-align:center}

  /* 인쇄 영역 */
  #printArea{display:none}
  #printArea.show{display:block;max-width:820px;margin:0 auto 70px;background:#fff;
    padding:38px 40px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  #printArea.capturing{border:0;border-radius:0;box-shadow:none;margin-bottom:0;padding:20px 24px}
  .sheetwrap{max-width:820px;margin:0 auto;padding:24px 20px 0}
  .sheetbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .sheethint{margin:12px 0 16px;font-size:12.5px;color:var(--muted);background:var(--sky-50);
    border:1px solid var(--line);border-left:3px solid var(--sky-500);border-radius:8px;padding:11px 14px}
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea.show{display:block!important;position:absolute;left:0;top:0;width:100%;
      max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none}
    @page{size:A4 portrait;margin:14mm}
  }
  .sheet{font-size:12px;color:#000}
  .sheet h1{text-align:center;font-size:22px;letter-spacing:.18em;margin:0 0 5px;font-weight:800}
  .sheet .sub{text-align:center;color:#444;font-size:11.5px;margin-bottom:18px}
  .sheet .secttl{font-weight:800;font-size:12.5px;margin:16px 0 6px}
  .sheet table{border:1px solid #333;width:100%;border-collapse:collapse}
  .sheet th,.sheet td{border:1px solid #999;padding:5px 7px;font-size:11.5px;color:#000;background:#fff!important}
  .sheet thead th{background:#EAF4FB!important;font-weight:700}
  .sheet tfoot td{background:#F3F8FC!important;font-weight:800}
  .sheet .ct{text-align:center}
  .sheet .rt{text-align:right}
  .sheet .info td.k,.sheet .sum td.k{background:#F3F8FC!important;font-weight:700;width:92px}
  .sheet .sum td.k{width:180px}
  .sheet .sum .rt{font-weight:700}
  .sheet .sum tr.tot td{background:#EAF4FB!important;font-weight:800;font-size:13px}
  .sheet .cf{margin-top:22px;text-align:center;font-size:11.5px;line-height:1.9}
  .sheet .sgs{display:flex;gap:16px;margin-top:16px}
  .sheet .sg{flex:1;border:1px solid #999;height:104px;padding:9px 11px;position:relative}
  .sheet .sg .t{font-weight:700;font-size:11.5px;margin-bottom:5px}
  .sheet .sg .nm{font-size:12px}
  .sheet .sg .sn{position:absolute;right:11px;bottom:11px;font-size:11px;color:#555}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ============================================================
   상수 · 유틸
============================================================ */
const KEY='hr_attendance_v1';
const COMPANIES=['민컴퍼니','더넥스트','아마겟돈'];
const YEAR=2026;
const DAYKR=['일','월','화','수','목','금','토'];
const HOL2026=[['2026-01-01','신정'],['2026-02-16','설날 연휴'],['2026-02-17','설날'],['2026-02-18','설날 연휴'],
  ['2026-03-01','삼일절'],['2026-03-02','삼일절 대체공휴일'],['2026-05-05','어린이날'],['2026-05-24','부처님오신날'],
  ['2026-05-25','부처님오신날 대체공휴일'],['2026-06-03','지방선거일'],['2026-06-06','현충일'],['2026-07-17','제헌절'],
  ['2026-08-15','광복절'],['2026-08-17','광복절 대체공휴일'],['2026-09-24','추석 연휴'],['2026-09-25','추석'],
  ['2026-09-26','추석 연휴'],['2026-09-28','추석 대체공휴일'],['2026-10-03','개천절'],['2026-10-05','개천절 대체공휴일'],
  ['2026-10-09','한글날'],['2026-12-25','성탄절']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const t2m=t=>{if(!t)return null;const[a,b]=t.split(':').map(Number);return a*60+b;};
const m2t=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const hm=m=>{m=Math.max(0,Math.round(m||0));return `${Math.floor(m/60)}시간 ${pad(m%60)}분`;};

/* 휴게시간 규칙: 총 체류 8시간 이상 → 60분 / 4시간 이상 → 30분 */
function breakOf(gross){ return gross>=480?60 : gross>=240?30 : 0; }
function calcWork(inT,outT){
  const a=t2m(inT), b=t2m(outT);
  if(a==null||b==null) return null;
  let gross=b-a; if(gross<0) gross+=1440;
  const brk=breakOf(gross);
  return {gross, brk, net:Math.max(0,gross-brk)};
}

/* ---------- Supabase RPC 호출 ---------- */
const Net = {
  ready(){
    return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(SUPABASE_URL)
        && (SUPABASE_ANON_KEY||'').length > 30;
  },
  async rpc(fn, args){
    if(!this.ready()) throw new Error('Supabase 연결 정보가 아직 설정되지 않았습니다.');
    let r;
    try{
      r = await fetch(`${SUPABASE_URL.replace(/\/$/,'')}/rest/v1/rpc/${fn}`, {
        method:'POST',
        headers:{'Content-Type':'application/json',
                 'apikey':SUPABASE_ANON_KEY,
                 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`},
        body: JSON.stringify(args||{})
      });
    }catch(e){ throw new Error('서버에 연결할 수 없습니다. 네트워크를 확인하세요.'); }
    const txt = await r.text();
    let body = null;
    try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
    if(!r.ok){
      const msg = (body && (body.message || body.hint || body.details)) || `서버 오류 (${r.status})`;
      const err = new Error(String(msg)); err.status = r.status; throw err;
    }
    return body;
  }
};

/* 앱 전체가 호출하는 저장 진입점 (기존 코드 그대로 사용) */
function save(){
  DIRTY=true; mirrorWrite(true); setMode('저장 중…');
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(()=>{ flush(); }, 400);
}

async function flush(){
  if(SAVING || !DIRTY) return;
  if(!Session.token || !DB) return;
  SAVING=true; DIRTY=false;
  try{
    const res = await Net.rpc('hr_push', {
      p_token: Session.token, p_doc: DB, p_base_version: DOC_VERSION
    });
    if(res && res.conflict){
      DB = res.doc; DOC_VERSION = res.version; normalizeDB();
      mirrorWrite(false); setMode('최신 내용으로 갱신됨');
      render();
      toast('다른 기기에서 먼저 저장되어 최신 내용을 불러왔습니다. 방금 입력한 내용을 다시 확인해 주세요.');
    }else{
      DOC_VERSION = res.version; RETRY_MS=0;
      mirrorWrite(false); setMode('Supabase 저장됨');
    }
  }catch(e){
    DIRTY=true; mirrorWrite(true);
    if(e.status===401 || /세션이 만료/.test(e.message||'')){
      setMode('세션 만료'); SAVING=false;
      Session.clear(); toast('세션이 만료되었습니다. 다시 로그인해 주세요.');
      go({screen:'login', me:null, role:null, loginView:'login', loginErr:''});
      return;
    }
    RETRY_MS = Math.min(RETRY_MS ? RETRY_MS*2 : 3000, 60000);
    setMode(`저장 실패 — ${Math.round(RETRY_MS/1000)}초 후 재시도`);
    setTimeout(()=>{ flush(); }, RETRY_MS);
  }finally{
    SAVING=false;
    if(DIRTY && !RETRY_MS) setTimeout(()=>{ flush(); }, 300);
  }
}

/* 저장이 끝날 때까지 기다림 (계정 저장처럼 순서가 중요한 경우) */
async function flushNow(){
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  for(let i=0;i<40 && (DIRTY||SAVING);i++){
    if(!SAVING) await flush(); else await new Promise(r=>setTimeout(r,150));
  }
  return !DIRTY;
}

/* ---------- 서버에서 최신 데이터 가져오기 ---------- */
async function pull({silent=true}={}){
  if(!Session.token) return false;
  if(DIRTY||SAVING) return false;          // 저장 대기 중이면 덮어쓰지 않음
  try{
    const res = await Net.rpc('hr_pull', {p_token: Session.token});
    if(res.version !== DOC_VERSION){
      DB = res.doc; DOC_VERSION = res.version; normalizeDB();
      mirrorWrite(false);
      if(UI.screen==='app') render();
    }
    setMode('Supabase 연결됨');
    return true;
  }catch(e){
    if(e.status===401 || /세션이 만료/.test(e.message||'')){
      Session.clear();
      if(!silent) toast('세션이 만료되었습니다. 다시 로그인해 주세요.');
      go({screen:'login', me:null, role:null, loginView:'login', loginErr:''});
    }else{
      setMode('오프라인 — 로컬 사본 표시 중');
    }
    return false;
  }
}

/* ============================================================

============================================================ */
const workersOf=co=>DB.workers.filter(w=>w.company===co);
const workerById=id=>DB.workers.find(w=>w.id===id);
const supById=id=>DB.sups.find(s=>s.id===id);
const recOf=(wid,date)=>(DB.rec[wid]||{})[date]||null;
function setRec(wid,date,patch){
  DB.rec[wid]=DB.rec[wid]||{};
  DB.rec[wid][date]=Object.assign({in:'',out:'',status:'draft',memo:''},DB.rec[wid][date],patch);

function monthRows(wid,y,m){
  const out=[]; const n=daysIn(y,m);
  for(let d=1;d<=n;d++){
    const date=ymd(y,m,d), r=recOf(wid,date);
    if(r&&(r.in||r.out)) out.push(Object.assign({date,day:new Date(y,m-1,d).getDay()},r));
  }
  return out;
}
/* ---------- 주휴수당 ----------
   · 지급 요건: ① 월~금 소정근로일 개근 + ② 해당 주 15시간 이상 근로 (둘 다 충족)
   · 평일 공휴일은 개근으로 인정
   · 금액 = 시급 × 8 × 해당 주 근무시간 ÷ 40 (상한 8시간분)
   · 차주 월요일(첫 소정근로일)에 실제 출근해야 지급 → 그 출근일이 속한 달에 반영
   · 승인 여부와 무관하게 입력된 출퇴근 기록으로 자동 산정 (반려 건은 제외) */
const workedOn=(wid,d)=>{const r=recOf(wid,d);return !!(r&&r.status!=='rejected'&&r.in&&r.out);};
const netOn=(wid,d)=>{const r=recOf(wid,d);if(!r||r.status==='rejected')return 0;const c=calcWork(r.in,r.out);return c?c.net:0;};
function weeklyPay(wid,y,m){
  const w=workerById(wid); if(!w) return {rows:[],total:0};
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  const rows=[]; let total=0; const n=daysIn(y,m);
  for(let d=1;d<=n;d++){
    const payMon=ymd(y,m,d);
    if(dowOf(payMon)!==1) continue;              // 지급 기준일 = 당월의 월요일
    const base=addDays(payMon,-7);               // 판정 대상 주(전주) 월요일
    const req=[],hol=[];
    for(let i=0;i<5;i++){
      const dt=addDays(base,i);
      if(!sched.includes(i+1)) continue;
      if(isHoliday(dt)){hol.push(dt);continue;}  // 평일 공휴일은 개근으로 인정
      req.push(dt);
    }
    if(!req.length && !hol.length) continue;
    let weekMin=0; for(let i=0;i<7;i++) weekMin+=netOn(wid,addDays(base,i));
    const absent=req.filter(dt=>!workedOn(wid,dt));
    const full=req.length>0 && absent.length===0;
    let chk=null;                                // 차주 첫 소정근로일(공휴일 제외)
    for(let i=0;i<5;i++){const dt=addDays(payMon,i); if(!sched.includes(i+1)||isHoliday(dt))continue; chk=dt; break;}
    const attended=chk?workedOn(wid,chk):false;
    const hours=Math.min(weekMin/60,40);
    const enough=weekMin>=900;                 // 해당 주 15시간 이상 근로
    const amt=(full&&attended&&enough)?Math.round(w.wage*8*hours/40):0;
    total+=amt;
    rows.push({payMon,from:base,to:addDays(base,6),reqN:req.length,holN:hol.length,
               absentN:absent.length,weekMin,full,chk,attended,enough,amt});
  }
  return {rows,total};
}
/* ---------- 연차 (1년 미만) ----------
   · 입사일부터 1개월 단위 기간을 개근하면 연차 1일 발생 (근로기준법 60조 2항)
   · 개근 = 해당 기간의 소정근로일(공휴일 제외)에 결근이 없는 상태
   · 1년 미만 기간 동안 최대 11일까지 발생 */
function addMonths(s,n){
  const d=dObj(s), day=d.getDate();
  const t=new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last=daysIn(t.getFullYear(), t.getMonth()+1);
  return ymd(t.getFullYear(), t.getMonth()+1, Math.min(day,last));
}
function leaveInfo(wid){
  const w=workerById(wid);
  if(!w||!w.hireDate) return {ok:false,periods:[],earned:0,months:0};
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  const t=todayStr(), periods=[];
  for(let i=0;i<11;i++){
    const from=addMonths(w.hireDate,i);
    const to=addDays(addMonths(w.hireDate,i+1),-1);
    let req=0,absent=0,worked=0;
    for(let d=from; d<=to; d=addDays(d,1)){
      if(!sched.includes(dowOf(d))||isHoliday(d)) continue;
      req++;
      if(d>t) continue;                // 아직 오지 않은 날은 판정 제외
      if(workedOn(wid,d)) worked++; else absent++;
    }
    const done=to<=t;
    periods.push({idx:i+1,from,to,req,worked,absent,done,
                  full:done&&req>0&&absent===0, earnDate:addDays(to,1)});
    if(!done) break;
  }
  const earned=periods.filter(p=>p.full).length;
  return {ok:true,periods,earned,months:periods.filter(p=>p.done).length,
          next:periods.find(p=>!p.done), maxed:earned>=11};
}

/* 공휴일 수당: 평일(월~금) 소정근로일에 걸린 공휴일만 대상
   · 주말(토·일)에 걸린 공휴일은 대상 제외
   · 급여지급 설정 → 소정근로일급 (소정근로시간 × 시급) 지급
   · 급여미지급 설정 → 0원 */
const schedMin=w=>{
  const a=t2m(w.startTime), b=t2m(w.endTime);
  if(a==null||b==null) return 0;
  let g=b-a; if(g<0) g+=1440;
  return Math.max(0,g-(w.breakMin||0));
};
const dayWage=w=>Math.round(schedMin(w)/60*(w.wage||0));
function holidayList(wid,y,m){
  const w=workerById(wid); if(!w) return [];
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  const paid=(w.holidayPay||'paid')==='paid';
  const out=[], n=daysIn(y,m), t=todayStr();
  for(let d=1;d<=n;d++){
    const date=ymd(y,m,d), dw=dowOf(date);
    if(date>t||!isHoliday(date)) continue;
    if(dw===0||dw===6) continue;        // 주말 공휴일은 제외
    if(!sched.includes(dw)) continue;   // 소정근로일이 아니면 제외
    const r=recOf(wid,date);
    if(r&&(r.in||r.out)) continue;   // 실제 근무한 공휴일은 일반 근무로 정산
    out.push({date,name:holName(date),paid,amt:paid?dayWage(w):0});
  }
  return out;
}
/* 결근: 소정근로일이며 공휴일이 아니고 오늘까지 지난 날인데 출퇴근 기록이 없는 날 */
function absentList(wid,y,m){
  const w=workerById(wid); if(!w) return [];
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  const out=[], n=daysIn(y,m), t=todayStr();
  for(let d=1;d<=n;d++){
    const date=ymd(y,m,d);
    if(date>t) continue;
    if(!sched.includes(dowOf(date))) continue;
    if(isHoliday(date)) continue;
    const r=recOf(wid,date);
    if(r&&(r.in||r.out)) continue;
    out.push({date,memo:(r&&r.memo)||''});
  }
  return out;
}
const schedOf=w=>(w.days&&w.days.length)?w.days:[1,2,3,4,5];
const isAbsentDay=(w,date)=>{
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  if(date>todayStr()||!sched.includes(dowOf(date))||isHoliday(date)) return false;
  const r=recOf(w.id,date);
  return !(r&&(r.in||r.out));
};
function setReason(wid,date,v){
  const val=(v||'').trim(), r=recOf(wid,date)||{};
  setRec(wid,date,{memo:val,status:(r.in||r.out)?r.status:'absent'});
  render(); toast(val?'사유가 저장되었습니다.':'사유를 지웠습니다.');
}
function summary(wid,y,m,approvedOnly=true){
  const w=workerById(wid); const rows=monthRows(wid,y,m);
  let days=0,net=0,brk=0,pending=0;
  rows.forEach(r=>{
    const c=calcWork(r.in,r.out); if(!c) return;
    if(r.status==='submitted') pending++;
    if(approvedOnly && r.status!=='approved') return;
    if(r.status==='rejected') return;
    days++; net+=c.net; brk+=c.brk;
  });
  const base=Math.round(net/60*(w?w.wage:0));
  const wk=weeklyPay(wid,y,m);
  const abs=absentList(wid,y,m);
  const hl=holidayList(wid,y,m);
  const holPay=hl.reduce((a,h)=>a+h.amt,0);
  return {days,net,brk,pending,base,weekly:wk.total,weeks:wk.rows,
          hols:hl,holPay,holN:hl.length,pay:base+wk.total+holPay,rows,
          absent:abs,absentN:abs.length,noReason:abs.filter(a=>!a.memo).length};
}
function companySummary(co,y,m){
  const ws=workersOf(co); let days=0,net=0,pay=0,pending=0,weekly=0;
  ws.forEach(w=>{const s=summary(w.id,y,m); days+=s.days; net+=s.net; pay+=s.pay; weekly+=s.weekly; pending+=s.pending;});
  return {count:ws.length,days,net,pay,weekly,pending};
}

async function doSignup(){

  const name=$('#su-name').value.trim(), birth=normBirth($('#su-birth').value),
        phone=fmtPhone($('#su-phone').value), userId=$('#su-id').value.trim(),
        pw=$('#su-pw').value, pw2=$('#su-pw2').value;
  if(!name||!birth||!phone||!userId||!pw){go({loginErr:'모든 항목을 입력하세요.'});return;}
  if(digits(phone).length<10){go({loginErr:'핸드폰번호를 정확히 입력하세요. 예: 010-1234-5678'});return;}
  if(userId.length<4){go({loginErr:'아이디는 4자 이상으로 입력하세요.'});return;}
  if(pw.length<4){go({loginErr:'비밀번호는 4자 이상으로 입력하세요.'});return;}
  if(pw!==pw2){go({loginErr:'비밀번호가 서로 일치하지 않습니다.'});return;}
  go({busy:true, loginErr:'', loginMsg:'가입 처리 중…'});
  try{

      {p_name:name, p_birth:birth, p_phone:phone, p_user_id:userId, p_pw:pw});
    HAS_MASTER=true; UI.busy=false;

    go({busy:false, loginMsg:'', loginErr:e.message||'가입에 실패했습니다.'});

/* ---------- 입력 정규화 ---------- */
const digits=v=>(v||'').replace(/[^0-9]/g,'');
function fmtPhone(v){
  const d=digits(v);
  if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length===10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return (v||'').trim();
}
function maskPhone(p){
  const d=digits(p); if(d.length<9) return p||'';
  const head=d.slice(0,3), tail=d.slice(-4), mid=d.slice(3,d.length-4);
  return `${head}-${'*'.repeat(mid.length)}-${tail}`;
}
function normBirth(v){
  const d=digits(v);
  if(d.length===8) return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
  return (v||'').trim();
}

        ${waits.slice(0,12).map(({w,r})=>{const c=calcWork(r.in,r.out);const sp=supById(w.supId);
          return `<tr><td><span class="pill p-co">${w.company}</span></td><td><b>${esc(w.name)}</b></td><td class="num">${r.date}</td>
          <td class="c num">${r.in}</td><td class="c num">${r.out}</td><td class="r num">${c?hm(c.net):'-'}</td>
          <td class="c">${sp?esc(sp.name):'-'}</td>
          <td class="c"><button class="btn ok sm" onclick="approve('${w.id}','${r.date}')">승인</button>
          <button class="btn dg sm" onclick="reject('${w.id}','${r.date}')">반려</button></td></tr>`;}).join('')}
      </tbody></table>`
      : `<div class="empty"><b>승인 대기 건이 없습니다</b>${y}년 ${m}월의 모든 근무 기록이 처리되었습니다.</div>`}
    </div>
  </div>`;
}
function setMonth(m){go({month:m,detail:null});}

/* ============================================================
   2. 근태·급여 관리 (마스터/감독자)
============================================================ */
function viewAtt(){
  const y=YEAR,m=UI.month;
  if(UI.detail) return viewDetail(UI.detail);
  const co = UI.role==='master'?UI.company:UI.me.company;
  let list = workersOf(co);
  if(UI.role==='sup') list=list.filter(w=>w.supId===UI.me.id);

  const rows=list.map(w=>({w,s:summary(w.id,y,m)}));
  const tD=rows.reduce((a,r)=>a+r.s.days,0), tN=rows.reduce((a,r)=>a+r.s.net,0),
        tB=rows.reduce((a,r)=>a+r.s.base,0), tK=rows.reduce((a,r)=>a+r.s.weekly,0),
        tP=rows.reduce((a,r)=>a+r.s.pay,0), tW=rows.reduce((a,r)=>a+r.s.pending,0),
        tA=rows.reduce((a,r)=>a+r.s.absentN,0), tR=rows.reduce((a,r)=>a+r.s.noReason,0),
        tH=rows.reduce((a,r)=>a+r.s.holPay,0);

  return `
  <div class="pagehead">
    <div><h1>${UI.role==='master'?'근태·급여 관리':'담당 근태 확인'}</h1>
      <p>${UI.role==='master'?'법인과 월을 선택하면 해당 월의 아르바이트 근무 내역이 표시됩니다.':`${esc(co)} · 내가 담당하는 아르바이트생의 근무 기록입니다.`}</p></div>
    ${tW?`<span class="pill p-wait">승인 대기 ${tW}건</span>`:'<span class="pill p-ok">전체 승인 완료</span>'}
    ${tR?`<span class="pill p-no">결근 사유 미기재 ${tR}건</span>`:''}
  </div>
  ${UI.role==='master'?coTabs():''}
  ${monTabs('setMonth')}

  <div class="stats">
    <div class="stat"><div class="lb">대상 인원</div><div class="vl">${rows.length}<small>명</small></div></div>
    <div class="stat"><div class="lb">총 근무시간</div><div class="vl">${hdec(tN)}<small>시간</small></div></div>
    <div class="stat"><div class="lb">기본급 합계</div><div class="vl" style="font-size:21px">${won(tB)}</div></div>
    <div class="stat"><div class="lb">주휴수당 합계</div><div class="vl" style="font-size:21px;color:var(--sky-700)">${won(tK)}</div></div>
    <div class="stat"><div class="lb">공휴일수당 합계</div><div class="vl" style="font-size:21px;color:var(--sky-700)">${won(tH)}</div></div>
    <div class="stat accent"><div class="lb">${co} ${m}월 총 지급액</div><div class="vl" style="font-size:23px">${won(tP)}</div></div>
  </div>

  <div class="card">
    <h3>${esc(co)} · ${y}년 ${m}월 근무 현황
      ${UI.role!=='part'&&tW?`<button class="btn ok sm" onclick="approveMonth('${co}')">대기 ${tW}건 일괄 승인</button>`:''}</h3>
    <div class="body tight">
      ${rows.length? `<table>
        <thead><tr><th>이름</th><th>업무</th><th class="c">근무일수</th><th class="c">결근</th><th class="r">근무시간</th><th class="r">시급</th><th class="r">기본급</th><th class="r">주휴수당</th><th class="r">공휴일수당</th><th class="r">총 지급액</th><th class="c">상태</th><th class="c">상세</th></tr></thead>
        <tbody>${rows.map(({w,s})=>`
          <tr>
            <td><b>${esc(w.name)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(w.job)}</div></td>
            <td class="num" style="font-size:12.5px;color:var(--muted)">${w.startTime}~${w.endTime}<div>휴게 ${w.breakMin}분 · ${daysLabel(w)}</div></td>
            <td class="c num">${s.days}일</td>
            <td class="c num">${s.absentN?`<span class="pill p-no">${s.absentN}일</span>${s.noReason?`<div style="font-size:11px;color:var(--warn);margin-top:3px">사유 ${s.noReason}건</div>`:''}`:'<span style="color:var(--muted)">-</span>'}</td>
            <td class="r num">${hm(s.net)}</td>
            <td class="r num">${won(w.wage)}</td>
            <td class="r num">${won(s.base)}</td>
            <td class="r num" style="color:${s.weekly?'var(--sky-700)':'var(--muted)'}">${won(s.weekly)}</td>
            <td class="r num" style="color:${s.holPay?'var(--sky-700)':'var(--muted)'}">${won(s.holPay)}${s.holN?`<div style="font-size:11px;color:var(--muted)">${(w.holidayPay||'paid')==='paid'?'유급':'무급'} ${s.holN}일</div>`:''}</td>
            <td class="r num"><b>${won(s.pay)}</b></td>
            <td class="c">${s.pending?`<span class="pill p-wait">대기 ${s.pending}</span>`:'<span class="pill p-ok">완료</span>'}</td>
            <td class="c"><button class="btn sm" onclick="go({detail:'${w.id}'})">기록 보기</button></td>
          </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">합계</td><td class="c num">${tD}일</td><td class="c num">${tA?tA+'일':'-'}</td><td class="r num">${hm(tN)}</td><td class="r">-</td><td class="r num">${won(tB)}</td><td class="r num">${won(tK)}</td><td class="r num">${won(tH)}</td><td class="r num">${won(tP)}</td><td colspan="2"></td></tr></tfoot>
      </table>`
      : `<div class="empty"><b>등록된 아르바이트생이 없습니다</b>${UI.role==='master'?'‘아르바이트 관리’ 메뉴에서 인력을 먼저 등록하세요.':'HR 담당자에게 담당 인력 배정을 요청하세요.'}</div>`}
    </div>
  </div>
  <div class="note"><b>급여 산정 기준</b> · 기본급은 <b>승인 완료된</b> 기록만 합산하며 (퇴근−출근−휴게시간) × 시급입니다. 주휴수당은 <b>승인 여부와 관계없이</b> 입력된 기록으로 자동 계산되며, <b>월~금 개근</b>과 <b>주 15시간 이상 근로</b>를 모두 충족한 주에 한해 <b>시급 × 8 × 해당 주 근무시간 ÷ 40</b>으로 산정합니다. 결근이 있거나 주 15시간에 미달하면 해당 주는 지급하지 않으며, 평일 공휴일은 개근으로 인정합니다.</div>`;
}
const daysLabel=w=>{const d=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  return d.slice().sort().map(x=>DAYKR[x]).join('')+'요일';};

/* ---------- 개인 월별 상세 ---------- */
function viewDetail(wid){
  const w=workerById(wid), y=YEAR, m=UI.month;
  const s=summary(wid,y,m), sp=supById(w.supId);
  const n=daysIn(y,m);
  const canEdit = UI.role==='master'||UI.role==='sup';

  let body='';
  for(let d=1;d<=n;d++){
    const date=ymd(y,m,d), dow=new Date(y,m-1,d).getDay(), r=recOf(wid,date);
    const hol=isHoliday(date);
    const cls=dow===0?'sun':dow===6?'sat':'';
    if(!r||(!r.in&&!r.out)){
      const hp=(s.hols||[]).find(x=>x.date===date);
      if(hp){
        body+=`<tr style="background:#FCF7EC"><td class="num">${m}월 ${d}일 <span style="color:var(--muted)">(${DAYKR[dow]})</span></td>
          <td colspan="3" style="color:var(--warn);font-weight:600">공휴일 · ${esc(hp.name)} (개근 인정)</td>
          <td class="r num"><b>${hp.amt?won(hp.amt):'0원'}</b></td>
          <td class="c">${hp.paid?'<span class="pill p-ok">유급</span>':'<span class="pill p-none">무급</span>'}</td>
          <td class="c">-</td></tr>`;
        continue;
      }
      if(hol){
        body+=`<tr style="background:#FCF7EC"><td class="num ${cls}">${m}월 ${d}일 <span style="color:var(--muted)">(${DAYKR[dow]})</span></td>
          <td colspan="4" style="color:var(--warn);font-weight:600">공휴일 · ${esc(holName(date))}</td>
          <td class="c"><span class="pill p-none">휴일</span></td><td class="c">-</td></tr>`;
        continue;
      }
      const isAbs=isAbsentDay(w,date);
      const isSched=schedOf(w).includes(dow);
      const future=date>todayStr();
      const memo=(r&&r.memo)||'';
      const state = isAbs ? {pill:'<span class="pill p-no">결근</span>',bg:'#FDF6F3',ph:'결근 사유 (예: 개인 사정, 병가, 무단결근)'}
        : !isSched ? {pill:'<span class="pill p-none">휴무</span>',bg:dow===0||dow===6?'#F7FAFB':'#FAFCFE',ph:'비고 (휴무일 근무 시 시간 입력)'}
        : future ? {pill:'<span class="pill p-co">예정</span>',bg:'#FAFCFE',ph:'비고'}
        : {pill:'<span class="pill p-none">기록 없음</span>',bg:'#F7FAFC',ph:'비고'};
      body+=`<tr style="background:${state.bg}">
        <td class="num ${cls}">${m}월 ${d}일 <span style="color:var(--muted)">(${DAYKR[dow]})</span></td>
        ${canEdit
          ? `<td class="c"><input class="tin" type="time" title="출근 시간 입력" onchange="editTime('${wid}','${date}','in',this.value)"></td>
             <td class="c"><input class="tin" type="time" title="퇴근 시간 입력" onchange="editTime('${wid}','${date}','out',this.value)"></td>
             <td colspan="2"><input class="tin" style="width:100%" placeholder="${state.ph}" value="${esc(memo)}" onchange="setReason('${wid}','${date}',this.value)"></td>
             <td class="c">${state.pill}${isAbs&&!memo?'<div style="margin-top:4px"><span class="pill p-wait">사유 필요</span></div>':''}</td>
             <td class="c"><button class="btn sm" onclick="fillSched('${wid}','${date}')" title="소정근로시간 ${w.startTime}~${w.endTime} 으로 입력">소정근로 입력</button></td>`
          : `<td class="c">-</td><td class="c">-</td>
             <td colspan="2">${memo?esc(memo):''}</td>
             <td class="c">${state.pill}</td><td class="c">-</td>`}
      </tr>`;
      continue;
    }
    const c=calcWork(r.in,r.out);
    body+=`<tr>
      <td class="num ${cls}">${m}월 ${d}일 <span style="color:var(--muted)">(${DAYKR[dow]})</span>${hol?' <span class="pill p-wait">공휴일</span>':''}</td>
      <td class="c">${canEdit?`<input class="tin" type="time" value="${r.in||''}" onchange="editTime('${wid}','${date}','in',this.value)">`:`<span class="num">${r.in||'-'}</span>`}</td>
      <td class="c">${canEdit?`<input class="tin" type="time" value="${r.out||''}" onchange="editTime('${wid}','${date}','out',this.value)">`:`<span class="num">${r.out||'-'}</span>`}</td>
      <td class="c num">${c?c.brk+'분':'-'}</td>
      <td class="r num"><b>${c?hm(c.net):'-'}</b></td>
      <td class="c">${statusPill(r.status)}</td>
      <td class="c">${canEdit?(r.status==='approved'
          ? `<button class="btn sm" onclick="unapprove('${wid}','${date}')">승인 해제</button>`
          : `<button class="btn ok sm" onclick="approve('${wid}','${date}')">승인</button> <button class="btn dg sm" onclick="reject('${wid}','${date}')">반려</button>`)
          +` <button class="btn dg sm" onclick="clearRec('${wid}','${date}')" title="출퇴근 시간만 지우고 일자는 유지합니다">시간 삭제</button>`:'-'}</td>
    </tr>`;
  }

  return `
  <div class="pagehead">
    <div><h1>${esc(w.name)} · ${y}년 ${m}월 근무 기록</h1>
      <p>${esc(w.company)} · ${esc(w.job)} · 소정근로 ${w.startTime}~${w.endTime} (휴게 ${w.breakMin}분) · ${daysLabel(w)} · 시급 ${won(w.wage)}</p></div>
    <div class="row">
      <button class="btn" onclick="go({detail:null})">← 목록으로</button>
      <button class="btn pri" onclick="openSheet('${wid}')">근무확인서 출력</button>
    </div>
  </div>
  ${monTabs('setMonth')}

  <div class="stats">
    <div class="stat"><div class="lb">확정 근무일수</div><div class="vl">${s.days}<small>일</small></div></div>
    <div class="stat"><div class="lb">결근</div><div class="vl" style="color:${s.absentN?'var(--no)':'var(--ink)'}">${s.absentN}<small>일</small>${s.noReason?`<span style="font-size:12px;font-weight:700;color:var(--warn);margin-left:6px">사유 미기재 ${s.noReason}</span>`:''}</div></div>
    <div class="stat"><div class="lb">총 근무시간</div><div class="vl">${hdec(s.net)}<small>시간</small></div></div>
    <div class="stat"><div class="lb">기본급</div><div class="vl" style="font-size:21px">${won(s.base)}</div></div>
    <div class="stat"><div class="lb">주휴수당</div><div class="vl" style="font-size:21px;color:var(--sky-700)">${won(s.weekly)}</div></div>
    <div class="stat"><div class="lb">공휴일수당 · ${(w.holidayPay||'paid')==='paid'?'유급':'무급'}</div><div class="vl" style="font-size:21px;color:var(--sky-700)">${won(s.holPay)}${s.holN?`<small> / ${s.holN}일</small>`:''}</div></div>
    <div class="stat accent"><div class="lb">총 지급액 (세전)</div><div class="vl" style="font-size:23px">${won(s.pay)}</div></div>
  </div>

  <div class="card">
    <h3>일자별 출퇴근 내역 ${s.pending?`<button class="btn ok sm" onclick="approveWorker('${wid}')">대기 ${s.pending}건 일괄 승인</button>`:'<span class="pill p-ok">전건 승인 완료</span>'}</h3>
    <div class="body tight">
      ${body? `<table><thead><tr><th>근무일</th><th class="c">출근</th><th class="c">퇴근</th><th class="c">휴게</th><th class="r">근무시간</th><th class="c">상태</th><th class="c">승인 처리</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>합계 ${s.days}일</td><td colspan="3" class="c">시급 ${won(w.wage)}</td><td class="r num">${hm(s.net)}</td><td colspan="2" class="r num">기본급 ${won(s.base)}</td></tr></tfoot></table>`
      : `<div class="empty"><b>기록된 근무일이 없습니다</b>아르바이트생이 출퇴근 시간을 입력하면 이곳에 표시됩니다.</div>`}
    </div>
    ${canEdit?`<div class="body" style="padding-top:0"><div class="note"><b>결근일 수정</b> · 결근으로 표시된 날도 관리자가 그 행에서 바로 <b>출근·퇴근 시간을 입력</b>하거나 <b>소정근로 입력</b> 버튼으로 소정근로시간을 한 번에 채울 수 있습니다. 입력하면 승인 대기 상태의 근무 기록으로 전환되고, 승인해야 급여에 반영됩니다. <b>시간 삭제</b>는 출퇴근 시간만 지우며 일자와 사유는 목록에 그대로 남습니다.</div></div>`:''}
  </div>

  ${weeklyCard(w,s)}

  ${UI.role==='master'?leaveCard(w):''}`;
}

/* 주휴수당 내역 카드 */
function weeklyCard(w,s){
  const rows=s.weeks||[];
  return `<div class="card"><h3>주휴수당 산정 내역 <span class="pill ${s.weekly?'p-ok':'p-none'}">${won(s.weekly)}</span></h3>
    <div class="body tight">
    ${rows.length?`<table>
      <thead><tr><th>판정 대상 주 (월~일)</th><th class="c">평일 소정근로일</th><th class="c">공휴일</th><th class="c">개근</th><th class="c">주 15시간</th><th class="c">차주 첫 출근일</th><th class="r">주 근무시간</th><th class="r">주휴수당</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="num">${mdLabel(r.from)} ~ ${mdLabel(r.to)}<div style="font-size:11.5px;color:var(--muted)">지급 기준일 ${mdLabel(r.payMon)}(월)</div></td>
        <td class="c num">${r.reqN}일</td>
        <td class="c num">${r.holN?r.holN+'일':'-'}</td>
        <td class="c">${r.full?'<span class="pill p-ok">개근</span>':`<span class="pill p-no">결근 ${r.absentN}일</span>`}</td>
        <td class="c">${r.enough?'<span class="pill p-ok">충족</span>':'<span class="pill p-no">미달</span>'}</td>
        <td class="c">${r.chk?`${mdLabel(r.chk)} ${r.attended?'<span class="pill p-ok">출근</span>':'<span class="pill p-no">미출근</span>'}`:'-'}</td>
        <td class="r num" style="color:${r.enough?'var(--ink)':'var(--no)'}">${hdec(r.weekMin)}h</td>
        <td class="r num"><b style="color:${r.amt?'var(--sky-700)':'var(--muted)'}">${won(r.amt)}</b></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="7">주휴수당 합계</td><td class="r num">${won(s.weekly)}</td></tr></tfoot>
    </table>`:`<div class="empty"><b>해당 월에 판정할 주가 없습니다</b>주휴수당은 당월의 월요일마다 직전 주를 판정해 지급합니다.</div>`}
    </div>

/* 승인 처리 */
function approve(wid,date){const r=recOf(wid,date); if(!r||!r.in||!r.out){toast('출근·퇴근 시간이 모두 입력되어야 승인할 수 있습니다.');return;} setRec(wid,date,{status:'approved'}); render();}
function unapprove(wid,date){ask('승인 해제','승인을 해제하면 아르바이트생이 시간을 다시 수정할 수 있습니다. 계속할까요?','승인 해제',()=>{setRec(wid,date,{status:'submitted'});render();toast('승인이 해제되었습니다.');});}
function reject(wid,date){setRec(wid,date,{status:'rejected'}); render();}
function approveWorker(wid){const y=YEAR,m=UI.month; monthRows(wid,y,m).forEach(r=>{if(r.status==='submitted'&&r.in&&r.out) setRec(wid,r.date,{status:'approved'});}); render();}
function approveMonth(co){
  let list=workersOf(co); if(UI.role==='sup') list=list.filter(w=>w.supId===UI.me.id);
  ask('일괄 승인',`${co}의 ${UI.month}월 승인 대기 건을 모두 승인합니다. 계속할까요?`,'전체 승인',()=>{
    list.forEach(w=>approveWorkerSilent(w.id)); render(); toast('승인 대기 건을 모두 승인했습니다.');});
}
function approveWorkerSilent(wid){monthRows(wid,YEAR,UI.month).forEach(r=>{if(r.status==='submitted'&&r.in&&r.out) setRec(wid,r.date,{status:'approved'});});}
function editTime(wid,date,f,v){
  const r=recOf(wid,date)||{};
  if(r.status==='approved'&&UI.role==='part'){toast('승인 완료된 기록은 수정할 수 없습니다.');render();return;}
  const wasAbsent=!(r.in||r.out);
  setRec(wid,date,{[f]:v,status:(r.status==='approved'?'approved':'submitted')}); render();
  if(wasAbsent&&v) toast(`${date} 기록이 등록되었습니다. 승인하면 급여에 반영됩니다.`);
}
function fillSched(wid,date){
  const w=workerById(wid); if(!w) return;
  setRec(wid,date,{in:w.startTime,out:w.endTime,status:'submitted'});
  render(); toast(`${date} 소정근로시간 ${w.startTime}~${w.endTime} 으로 입력했습니다. 승인하면 급여에 반영됩니다.`);
}
function clearRec(wid,date){
  ask('출퇴근 시간 삭제',`${date} 의 출근·퇴근 시간을 지웁니다. 일자와 사유는 그대로 남고, 소정근로일이면 결근으로 표시됩니다.`,'시간 삭제',()=>{
    setRec(wid,date,{in:'',out:'',status:'absent'});
    render(); toast('출퇴근 시간을 삭제했습니다. 일자는 목록에 그대로 유지됩니다.');
  },true);
}

function exportData(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`근태데이터_백업_${todayStr()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
    toast('백업 파일을 내려받았습니다. 안전한 위치에 보관하세요.');
  }catch(e){ toast('백업 파일 생성에 실패했습니다.'); }
}
function importData(input){
  const f=input.files&&input.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d=null;
    try{ d=JSON.parse(rd.result); }catch(e){}
    input.value='';
    if(!d||!Array.isArray(d.masters)||!Array.isArray(d.workers)){ toast('올바른 백업 파일이 아닙니다.'); return; }

      DB=d; normalizeDB(); save();

          loginMsg:'데이터를 복원했습니다. 다시 로그인해 주세요.',find:{step:1,acct:null}});

function editMasterOpen(id){go({editMaster:Object.assign({},DB.masters.find(m=>m.id===id))});}

async function saveMaster(id){
  if(!UI.me.owner){toast('최초 마스터관리자만 계정을 등록·수정할 수 있습니다.');return;}
  const name=$('#a-name').value.trim(), birth=normBirth($('#a-birth').value),
        phone=fmtPhone($('#a-phone').value), pw=$('#a-pw').value;
  if(!name||!birth||!phone){toast('성명, 생년월일, 핸드폰번호는 필수입니다.');return;}
  if(digits(phone).length<10){toast('핸드폰번호를 정확히 입력하세요.');return;}
  let target;
  if(id){
    const m=DB.masters.find(x=>x.id===id);
    Object.assign(m,{name,birth,phone}); delete m.pw;
    if(m.id===UI.me.id) UI.me=m;
    target=m;
  }else{
    const userId=$('#a-id').value.trim();
    if(userId.length<4){toast('아이디는 4자 이상으로 입력하세요.');return;}
    if(pw.length<4){toast('비밀번호는 4자 이상으로 입력하세요.');return;}
    if(DB.masters.some(x=>x.userId===userId)){toast('이미 사용 중인 아이디입니다.');return;}
    target={id:uid('m'),name,birth,phone,userId,company:'본사 HR',owner:false};
    DB.masters.push(target);
  }
  save(); go({editMaster:null});
  // 문서가 서버에 올라간 뒤에 자격증명(비밀번호·핸드폰번호)을 반영합니다.
  try{
    await flushNow();
    // 새 계정이면 hr_set_pw 가 자격증명 행을 만들므로 먼저 호출해야 합니다.
    if(pw) await Net.rpc('hr_set_pw',{p_token:Session.token, p_master_id:target.id, p_pw:pw});
    await Net.rpc('hr_sync_cred',{p_token:Session.token, p_master_id:target.id,
                                  p_user_id:target.userId||'', p_phone:phone});
    toast(pw ? '계정 정보와 비밀번호를 저장했습니다.' : '계정 정보를 저장했습니다.');
  }catch(e){
    toast('계정은 저장되었으나 비밀번호 반영에 실패했습니다: '+(e.message||''));
  }
}
function delMaster(id){
  const m=DB.masters.find(x=>x.id===id);
  if(!UI.me.owner||m.owner){toast('최초 마스터관리자 계정은 삭제할 수 없습니다.');return;}
  ask('관리자 계정 삭제',`${m.name} 관리자 계정을 삭제합니다. 해당 계정으로는 더 이상 로그인할 수 없습니다.`,'삭제',()=>{
    DB.masters=DB.masters.filter(x=>x.id!==id); save();
    if(UI.editMaster&&UI.editMaster.id===id) UI.editMaster=null;
    if(m.id===UI.me.id){logout();return;}
    render(); toast(`${m.name} 관리자 계정을 삭제했습니다.`);},true);
}

          <td class="num" style="font-size:12.5px">${n?`${n.earnDate} <span style="color:var(--muted)">(${n.absent?`현재 결근 ${n.absent}일 · 발생 불가`:'개근 유지 중'})</span>`:'<span style="color:var(--muted)">1년 미만 한도(11일) 도달</span>'}</td>

function addHoliday(){

  DB.holidays.push({date,name}); save(); render();
}
function delHoliday(date){DB.holidays=DB.holidays.filter(h=>h.date!==date); save(); render();}

}

function viewMy(){
  const w=UI.me, y=YEAR, m=UI.month;
  const date=UI.myDate, r=recOf(w.id,date)||{in:'',out:'',status:'draft'};
  const locked=r.status==='approved';
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  const dow=dowOf(date);
  const offDay=!sched.includes(dow);          // 소정근로일 아님
  const hol=isHoliday(date);
  const blocked=locked||offDay||hol;
  const c=calcWork(r.in,r.out);
  const s=summary(w.id,y,m);
  const now=new Date(), nowT=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const sp=supById(w.supId);

  let rows='';
  const nDays=daysIn(y,m);
  for(let dd=1;dd<=nDays;dd++){
    const dt=ymd(y,m,dd), dw=dowOf(dt), rr=recOf(w.id,dt);
    const cls=dw===0?'sun':dw===6?'sat':'';
    if(!rr||(!rr.in&&!rr.out)){
      if(isAbsentDay(w,dt)){
        const memo=(rr&&rr.memo)||'';
        rows+=`<tr style="background:#FDF6F3"><td class="num ${cls}">${m}월 ${dd}일 (${DAYKR[dw]})</td>
          <td class="c"><span class="pill p-no">결근</span></td>
          <td colspan="4">${memo?esc(memo):'<span style="color:var(--muted)">감독자 사유 기재 대기</span>'}</td>
          <td class="c">-</td></tr>`;
      }
      continue;
    }
    const cc=calcWork(rr.in,rr.out);
    rows+=`<tr><td class="num ${cls}">${m}월 ${dd}일 (${DAYKR[dw]})</td>
      <td class="c num">${rr.in||'-'}</td><td class="c num">${rr.out||'-'}</td>
      <td class="c num">${cc?cc.brk+'분':'-'}</td><td class="r num"><b>${cc?hm(cc.net):'-'}</b></td>
      <td class="c">${statusPill(rr.status)}</td>

      ${hol?`<div class="offbox">공휴일은 입력이 불가합니다<span>${esc(holName(date))}</span></div>`

      <div class="tval"><span>휴게시간 자동 반영</span><b class="num">${c?c.brk+'분':'-'}</b></div>
      <div class="tval"><span>이 날의 근무시간</span><b class="num">${c?hm(c.net):'-'}</b></div>
      <div style="text-align:right">${hol?'<span class="pill p-none">공휴일</span>':offDay?'<span class="pill p-none">소정근로일 아님</span>':statusPill(r.status)}</div>
    </div>
  </div>

  ${monTabs('setMonth')}

function isSchedDay(w,d){
  const sched=(w.days&&w.days.length)?w.days:[1,2,3,4,5];
  return sched.includes(dowOf(d));
}
function fillNow(f){
  const el=$('#my-out'); if(!el) return;
  const n=new Date(); el.value=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
}
function canInput(w,d){
  if(isHoliday(d)){toast(`${holName(d)} · 공휴일은 입력이 불가합니다.`);render();return false;}
  if(!isSchedDay(w,d)){toast(`${DAYKR[dowOf(d)]}요일은 소정근로일이 아닙니다. 근로요일(${daysLabel(w)})에만 입력할 수 있습니다.`);render();return false;}
  const r=recOf(w.id,d);
  if(r&&r.status==='approved'){toast('승인 완료된 기록은 수정할 수 없습니다.');render();return false;}
  return true;
}
/* 출근: 버튼을 누른 현재 시각으로만 기록 (직접 입력 불가) */
function punchIn(){
  const w=UI.me, d=UI.myDate;
  if(!canInput(w,d)) return;
  if(d!==todayStr()){toast('출근 기록은 당일에만 가능합니다. 지난 날짜는 감독자에게 요청하세요.');render();return;}
  const r=recOf(w.id,d);
  if(r&&r.in){toast('이미 출근이 기록되었습니다. 수정이 필요하면 감독자에게 문의하세요.');return;}
  const n=new Date(), v=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  setRec(w.id,d,{in:v,status:'submitted'});
  render(); toast(`출근 ${v} 기록이 완료되었습니다.`);
}
/* 퇴근: 시간 직접 입력 후 신청 */
function applyTime(f){
  const w=UI.me, d=UI.myDate;
  if(!canInput(w,d)) return;
  const r=recOf(w.id,d);
  if(!(r&&r.in)){toast('출근하기 버튼을 먼저 눌러주세요.');return;}

  setRec(w.id,d,{out:v,status:'submitted'});
  render(); toast(`퇴근 ${v} 신청이 완료되었습니다. 감독자 승인 후 확정됩니다.`);
}

/* 인쇄하기 → PDF 파일로 저장 */
async function savePDF(){
  const el=$('#printArea'), w=workerById(UI.sheet);
  if(!el||!w) return;
  const btn=$('#pdfBtn');
  if(!window.html2canvas||!window.jspdf){
    toast('PDF 변환 도구를 불러오지 못했습니다. 인쇄 창에서 «PDF로 저장»을 선택하세요.');
    setTimeout(()=>window.print(),600); return;
  }
  try{
    if(btn){btn.disabled=true; btn.textContent='PDF 생성 중…';}
    toast('PDF를 만들고 있습니다. 잠시만 기다려 주세요.');
    el.classList.add('capturing');
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:el.scrollWidth});
    el.classList.remove('capturing');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const PW=210, PH=297, MG=10, iw=PW-MG*2;
    const ih=canvas.height*iw/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.95);
    let left=ih, pos=MG;
    pdf.addImage(img,'JPEG',MG,pos,iw,ih);
    left-=(PH-MG*2);
    while(left>0){
      pos=left-ih+MG;
      pdf.addPage();
      pdf.addImage(img,'JPEG',MG,pos,iw,ih);
      left-=(PH-MG*2);
    }
    pdf.save(`근무확인서_${w.name}_${YEAR}년${UI.month}월.pdf`);
    toast('PDF 파일로 저장했습니다.');
  }catch(e){
    el.classList.remove('capturing');
    toast('PDF 생성에 실패했습니다. 인쇄 창에서 «PDF로 저장»을 이용해 주세요.');
    setTimeout(()=>window.print(),600);
  }finally{
    if(btn){btn.disabled=false; btn.textContent='인쇄하기 (PDF 저장)';}
  }
}

    <div class="secttl">2. 일자별 출퇴근 내역</div>
    <table>
      <thead><tr><th style="width:8%">일자</th><th style="width:6%">요일</th><th style="width:11%">출근</th><th style="width:11%">퇴근</th><th style="width:9%">휴게</th><th style="width:12%">근무시간(h)</th><th style="width:9%">승인</th><th>비고</th></tr></thead>
      <tbody>${tb||'<tr><td colspan="8" class="ct" style="padding:18px">기록 없음</td></tr>'}</tbody>
      <tfoot><tr><td colspan="5" class="ct">합계</td><td class="rt">${hdec(s.net)}</td><td class="ct">${s.days}일</td><td></td></tr></tfoot>
    </table>

    <div class="cf">위와 같이 ${y}년 ${m}월의 근무 내역 및 급여 산정 내용을 확인합니다.<br><br>${y}년 &nbsp;&nbsp; 월 &nbsp;&nbsp; 일</div>

    <div class="sgs">
      <div class="sg"><div class="t">아르바이트</div><div class="nm">성명 : ${esc(w.name)}</div><div class="sn">(서명 또는 인)</div></div>
      <div class="sg"><div class="t">담당 감독자</div><div class="nm">성명 : ${sp?esc(sp.name):'____________'}</div><div class="sn">(서명 또는 인)</div></div>
    </div>
  </div>`;
}

function renderSheet(){
  const w=workerById(UI.sheet);
  if(!w){ go({screen:'app'}); return; }
  $('#app').innerHTML=`<div class="sheetwrap">
    <div class="sheetbar">
      <div><button class="btn" onclick="backFromSheet()">← 근태 화면으로</button></div>
      <div class="row">
        <span class="pill p-co">${esc(w.name)} · ${YEAR}년 ${UI.month}월</span>
        <button class="btn" onclick="doPrint()">인쇄 미리보기</button>
        <button class="btn pri" id="pdfBtn" onclick="savePDF()">인쇄하기 (PDF 저장)</button>
      </div>
    </div>
    <div class="sheethint"><b>인쇄하기</b>를 누르면 아래 문서가 <b>PDF 파일로 저장</b>됩니다. 파일명은 «근무확인서_이름_연월.pdf» 이며, 출력 후 아르바이트생과 담당 감독자의 서명을 받으세요.</div>
  </div>`;
  $('#printArea').innerHTML=buildSheet(UI.sheet);
  $('#printArea').className='show';
}

/* ============================================================
   확인 모달 · 알림 (브라우저 confirm/alert 대체)
============================================================ */
let _askFn=null, _toastTimer=null;
function ask(title,msg,label,fn,danger){
  _askFn=fn;
  $('#modal').innerHTML=`<div class="ovl" onclick="if(event.target===this)closeAsk()">
    <div class="dlg">
      <div class="h">${esc(title)}</div>
      <div class="b">${esc(msg)}</div>
      <div class="f"><button onclick="closeAsk()">취소</button>
      <button class="${danger?'dgo':'go'}" onclick="confirmAsk()">${esc(label||'확인')}</button></div>
    </div></div>`;
}
function closeAsk(){_askFn=null;$('#modal').innerHTML='';}
function confirmAsk(){const f=_askFn;closeAsk();if(f)f();}
function toast(msg){
  $('#toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{$('#toast').innerHTML='';},2600);
}

/* ============================================================
   렌더
============================================================ */
function render(){
  if(UI.screen!=='sheet'){ $('#printArea').className=''; $('#printArea').innerHTML=''; }
  if(UI.screen==='login'){$('#app').innerHTML=renderLogin();return;}
  if(UI.screen==='sheet'){renderSheet();return;}
  let inner='';
  if(UI.role==='part') inner = viewMy();
  else if(UI.role==='sup') inner = viewAtt();
  else inner = UI.nav==='dash'?viewDash(): UI.nav==='att'?viewAtt(): UI.nav==='workers'?viewWorkers(): UI.nav==='sups'?viewSups(): UI.nav==='admins'?viewMasters(): UI.nav==='holiday'?viewHolidays(): UI.nav==='leave'?viewLeave():viewRule();
  $('#app').innerHTML=shell(inner);
}
(async function init(){
  render();   // 로그인 화면 먼저 표시

  if(!Net.ready()){
    setMode('Supabase 미설정');
    go({loginErr:'Supabase 연결 정보가 설정되지 않았습니다. index.html 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 를 입력하세요.'});
    return;
  }

  // 가입 가능 여부 확인
  try{
    const st = await Net.rpc('hr_state');
    HAS_MASTER = !!st.hasMaster;
    setMode('Supabase 연결됨');
  }catch(e){
    setMode('서버 연결 실패');
    go({loginErr:'서버에 연결할 수 없습니다. ' + (e.message||'')});
    return;
  }

  // 저장된 세션이 있으면 자동 로그인
  const tok = Session.load();
  if(!tok){ render(); return; }
  try{
    const res = await Net.rpc('hr_pull', {p_token: tok});
    DB = res.doc; DOC_VERSION = res.version; normalizeDB();

    // 새로고침 전에 저장하지 못한 변경이 남아 있으면 복구
    const mir = mirrorRead();
    if(mir && mir.dirty && mir.doc){
      DB = mir.doc; normalizeDB(); DIRTY = true;
      setMode('저장하지 못한 변경 반영 중…');
      flush();
    }else{
      mirrorWrite(false);
    }

    const me = res.role==='master'
      ? (DB.masters||[]).find(m=>m.id===res.subjectId)
      : res.role==='sup'
        ? (DB.sups||[]).find(s=>s.id===res.subjectId)
        : (DB.workers||[]).find(w=>w.id===res.subjectId);
    if(!me){ Session.clear(); render(); return; }

    go({screen:'app', me, role:res.role,
        nav: res.role==='master'?'dash':'att',
        company: (res.role==='sup' && me.company) ? me.company : COMPANIES[0],
        month:new Date().getMonth()+1, detail:null, myDate:todayStr()});
  }catch(e){
    Session.clear();
    render();
  }
})();
</script>
</body>
</html>
